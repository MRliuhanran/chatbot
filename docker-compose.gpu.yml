# GPU 覆盖文件（自有 Linux + NVIDIA 主机用）——**本地 Mac 不适用**：
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# 为什么单列一个文件：基础 compose 是 CPU 档（本地 Mac / 无卡服务器都能起），而
# NVIDIA 设备申请是与宿主强相关的可选能力，混进基础文件会让无卡机器直接起不来。
#
# 只把**生成模型**交给 GPU：ollama 官方镜像自带 CUDA 运行库，申请设备即可生效。
# 验证：docker compose -f docker-compose.yml -f docker-compose.gpu.yml exec ollama nvidia-smi
#
# 嵌入（embed 容器）与应用内的重排（app 镜像）**仍是 CPU**：app 镜像按 CPU 索引装
# torch（Dockerfile 的 TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu），容器里
# 没有 CUDA 版 torch，给了设备也用不上。要让嵌入/重排也上 GPU，需要另建 CUDA 版镜像
# （换基础镜像 + 把 TORCH_INDEX_URL 指向 cu121 索引），属另一件事，本文件不含。
# 故这里**不给 embed/app 写任何占位环境变量**——写了不生效的开关正是本仓库点名的
# 静默失效原型（见 .env 的"这些名字不存在"一节）。
#
# 前置：宿主已装 NVIDIA 驱动 + nvidia-container-toolkit，且 `docker info` 里能看到
# nvidia runtime。设备申请用的是 compose v2 的 deploy.resources.reservations.devices。
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
