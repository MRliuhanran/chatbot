# 项目级 Streamlit 配置（对本目录下所有 `streamlit run` 生效）
# CLI 参数优先级高于本文件，故 chatbot.py 里也显式传了同样的地址。
[server]
# 只监听回环地址：本机可访问，局域网/外网访问不到。
# 若确实想让同网段机器访问，改成 "0.0.0.0"（有暴露风险）。
address = "127.0.0.1"
port = 8501
headless = true
# 平台网关会把 Host 改写为容器内部地址，外部域名与之不同源，
# 不在白名单会被 Streamlit 拒绝 WebSocket（页面 200 但一直转圈）。
corsAllowedOrigins = [
  "https://liuhanran-chatbot.ms.show",
  "https://studio-liuhanran-chatbot.api-inference.modelscope.net",
]

[client]
# 极简前端：隐藏工具条，异常不显示细节
# 可选值：auto / developer / viewer / minimal
toolbarMode = "minimal"
showErrorDetails = "none"
