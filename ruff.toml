# ── ruff 仓库级 lint 配置（2026-11-12 审计 F8 落地）─────────────────────────────
# 为什么现在才建：ruff 0.16.0（2026-07-23 发布）把缺省 select 从 59 条扩到 413 条，
# 本仓库此前**没有任何配置文件** —— lint 面完全由 ruff 版本内建缺省撑着；而 0.17
# 已定案把 DTZ005 等 7 条 naive-datetime 规则移出缺省集（本基线有 DTZ005×5），一旦
# 升级 ruff，闸门会**静默缩水**（报得更少却显得更绿）。显式化 = 家族 select +
# 定点 ignore（每条带原因），在本仓库实测与 ruff 0.16.7 缺省面**逐码等值**
# （chatbot.py 15 码 / 224 条 = tools/ruff-baseline.json）。
# 增减由 tools/lint_gate.py + ./start.sh lint 机检：新发现 = 失败（先修代码，或
# 有意识地再生基线并在 commit 里说明），减少 = 放行（技术债清了是好事）。
# ⚠️ 不设 target-version：缺省解析与"无配置"现状逐字同源；显式设置会改变 UP 族
#    建议形态（py310 起 X | None 等），等于换了一个面。

[lint]
# 家族原则：只选"能抓真错误/真债"的族，风格族（E 行宽空白、D docstring、C90 复杂度、
# ANN 类型标注…）不进本闸 —— 单文件哲学下风格债由 code review 管，lint 管正确性。
select = [
    "BLE",   # 吞错审视：本项目 121 处"观测/缓存/台账绝不拖垮主链路"的兜底全在借它记账
    "UP",    # 语法现代化（主要存量债：UP031 printf 风格 ×48，攒着一次清）
    "S",     # 子进程/临时文件/URL 安全审视（本机工具语境噪音见 ignore）
    "PLW",   # pylint 警告面（subprocess check 缺失等）
    "F",     # pyflakes：真错误（未用 import、未定义名）
    "DTZ",   # naive datetime（运行台账/落盘时间戳必须带 tz）
    "TRY",   # try/except 结构审查
    "B",     # bugbear（默认参数可变对象等）
    "SIM",   # 可简化形态
    "RUF",   # ruff 自有规则（CJK 噪音三条定点退役，见下）
    "PERF",  # 循环/推导式性能形态
    "W605",  # 精确码而非 W 家族：W 其余全是空白/行宽风格债，不进本闸
]
ignore = [
    # ── CJK 语料代码库的固有事象 ──────────────────────────────────────────────
    # 中文正文/日志/文案里全角引号「」“”、破折号——与西里尔/希腊字母混排是语料
    # 本体（毛选文本）与 UI 文案的常态，"歧义 unicode"告警在 CJK 场景是纯噪声
    # （还会把正当的中文标点当危险字符报）。RUF 家族其余规则照常生效。
    "RUF001", "RUF002", "RUF003",
    # ── 结构性设计决策（不是坏味道，改了反而破坏语义）────────────────────────
    "PLW0603",  # global 语句：模块级单例（_ENGINE/_sparse_pool/_otel_state/_QUERY_CACHE）
                # 就是本架构的真相源，global 是它们的读写机制——迟绑定单例不是全局变量债。
    "TRY003",   # 异常消息带上下文是本项目日志哲学（"报错要能归因"，见 README §9）；
                # raise-vanilla-args 强推 84 处重构成 raise X(...) from 形态 = 纯 churn。
    "TRY300", "TRY301",  # try 体尾部是台账/日志收尾（多行副作用），else 归位重排
                # churn 大、可读性无收益；TRY301 的"raise within try"是逐批记账的
                # 刻意形态（单批失败不废整批）。
    "PERF203",  # 循环内 try：同上，逐条目兜底是刻意的批量语义。
    "SIM105",   # try/except-告警 回退刻意不用 contextlib.suppress：失败要留一行日志
                # （缺包降级/观测退场全是"增收益位"，退场必须可见）。
    "PERF401",  # 手写 list 循环体里混着 per-item 日志/条件副作用，转 extend 推导
                # 会改变求值顺序与可读性。
    "SIM110",   # os.walk 存在性探针（_ollama_models_present）写成 any() 三元组生成器
                # 语义等价但更难读——保留直陈循环。
    "RUF005",   # 两字面列表拼接（NO_PROXY 回环组装 / sys.argv 改写）转 [*a, *b]
                # 纯风格，churn > 收益。
    # ── 本机工具语境的 bandit 噪音（输入全为常量/内部值，无外部拼接）─────────
    "S603",     # subprocess 调用审计：pgrep/lsof/pkill/ollama 的参数全是仓库内
                # 常量或 pid 文件读数，无不可信输入进命令行。
    "S607",     # 半路径可执行名（pgrep/lsof/lsof）：本机启动器语境，PATH 卫生由
                # 用户环境保证，写全路径反而绑死发行版布局。
    "S606",     # 不经 shell 起进程（cmd_all 的 qdrant/ollama 子进程）：这正是
                # 安全推荐形态本身，bandit 只是提示"确认不用 shell"——确认过了。
    "S310",     # urlopen URL 审计：探测端点全是 127.0.0.1 自检端口（infinity/qdrant
                # 健康），无任何外部输入进 URL。
    "S108",     # /tmp 硬编码：跨进程握手标记文件（下载状态、预热就绪），不存敏感
                # 数据，写系统临时目录正是"跨用户可见握手"的意图。
    "S104",     # 绑定全网卡告警：cmd_all 的容器部署面需要 0.0.0.0（平台网关探测）；
                # 本地 serve 钉 127.0.0.1 是另一条路径（.streamlit/config.toml 同款）。
    # ── 缺省面没有但家族内多出的两条 bugbear（0.16 缺省 413 集不含它们）────────
    "B904",     # except 内重抛：tokenizer 兜底链"重抛首个失败"的链语义需单独审议
                # （加 from 会把首因伪装成近因），不属家族默认面。
    "B905",     # zip 无 strict：写入批的 (chunk, emb) 由同一循环按序产出，长度结构
                # 上恒等；加 strict= 是把结构不变量改成断言，属代码改动非 lint 修。
    # ── 逐行原地归一的流式解析惯用形 ─────────────────────────────────────────
    "PLW2901",  # for 变量原地替换（行 strip/引号剥离、流 delta 累加）是流式解析的
                # 标准写法，重命名变量只会加一层间接。
]
