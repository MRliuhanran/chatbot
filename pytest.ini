[pytest]
testpaths = tests

# 不递归进这些目录，免得收集到非测试文件。
norecursedirs = .git __pycache__ .idea .pytest_cache qdrant_storage cache_v2 models books

# 让 tests/ 里的用例能 import rag（仓库根加入 sys.path）。
# 不用 conftest 手工 sys.path.insert，原因是这样在 --import-mode=importlib 下也成立。
pythonpath = .

# 默认跳过 slow（全栈检索质量回归，分钟级）。
# 分层用法：
#   pytest -m unit            L0 纯函数，<2s，无模型/无 Qdrant/无语料 —— CI 门禁用这层
#   pytest -m needs_chunks    L1 分块不变量（只需 cache_v2/chunks.json）
#   pytest -m needs_qdrant    L2 索引一致性（只需 Qdrant 在跑）
#   pytest -m slow            L3 检索质量回归（需模型 + 索引）
#   pytest                    L0+L1+L2（slow 默认跳过）
markers =
    unit: 纯函数单测，不需要模型 / Qdrant / 语料
    needs_chunks: 需要 cache_v2/chunks.json（python rag.py process 的产物）
    needs_qdrant: 需要 Qdrant 服务在运行
    needs_models: 需要本地嵌入 / 重排模型
    slow: 全栈检索质量回归（分钟级）

addopts = -m "not slow" -ra

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
