; ─────────────────────────────────────────────────────────────────────────────
; supervisord 多进程编排（可选入口；容器默认入口仍是 Dockerfile 的
; ENTRYPOINT python chatbot.py all —— 那条路径带模型引导 + 两段式就绪门，见 README）
; 用法（经 start.sh，会先加载 .env）:
;   ./start.sh supervisor | supervisor-status | supervisor-stop
; 也可裸跑:  supervisord -n -c supervisord.conf
;   （裸跑前先 mkdir -p artifacts/logs：日志文件打不开 supervisord 会拒启；.env
;   的注入由每个 program 载荷内的 bash set -a source 完成，不依赖启动方式）
; ─────────────────────────────────────────────────────────────────────────────

[supervisord]
; nodaemon 不写死：默认 false（裸跑可 daemon），计划用法是用 -n 前台挂着。
logfile=%(here)s/artifacts/logs/supervisord.log
logfile_maxbytes=20MB
logfile_backups=3
pidfile=%(here)s/artifacts/supervisor.pid

[unix_http_server]
; supervisorctl 与 supervisord 通信的唯一通道；目录 artifacts/ 仓库已存在。
file=%(here)s/artifacts/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix://%(here)s/artifacts/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

; ── 公共载荷说明：为什么每个 command 都包 bash -c ─────────────────────────────
; 1. .env：supervisord 子进程**不会**自动读 .env（start.sh 的 _load_dotenv 只管它
;    自己的脚本调用链）。统一用 bash 的 set -a source .env 注入（仓库 .env 里 60
;    余个 RAG_*/OLLAMA_*/QDRANT_*/MODEL 等**整包导出**，白名单语义与 _load_dotenv
;    等价 —— 当前 .env 的赋值行全部落在白名单前缀内，已逐行核对）。
;    与 start.sh 有一处已知差异：start.sh 里进程环境优先于 .env，本 conf 下被
;    source 的 .env 会覆盖继承环境 —— 即本 conf 把 .env 当**唯一事实源**；确需
;    覆盖时直接改 .env。当前 .env 全部为无空格的简单赋值（无行内注释、无引号、
;    无 $ / 反引号），bash source 是安全的。
; 2. 默认值：qdrant/ollama 仍用 bash 的 ${VAR:-默认} 语义（supervisord 自己的
;    %(ENV_X)s 展开不能带缺省值，不适合这里），默认与 start.sh/cmd_all 逐字对齐
;    （见各 program 注释）；infinity/app 的参数缺省已整体移交 chatbot.py 单点
;    （run-* 子命令），载荷里不再出现默认值表达式。
; 3. PATH：ollama 从 PATH 解析（与 start.sh 同语义）；infinity_emb 的解析在
;    _infinity_spec（shutil.which）里做，缺了会写进 infinity.log 后退出（startsecs
;    内收敛 FATAL）。容器内启用本 conf 时注意 export PATH 满足 ollama（或导出
;    OLLAMA_BIN/QDRANT_BIN 覆盖默认）。
; 4. stdout 与 stderr 合流（redirect_stderr=true）＝ start.sh 的 >log 2>&1 写法。
; 5. 所有 program 都 stopasgroup/killasgroup：streamlit 会 fork 子服务进程、
;    infinity(torch) 常有线程池，只杀父进程会留孤儿。
; 6. curl：（2026-11-11 audit A3 起）infinity/app 的健康预检与看门狗轮询已整体
;    移入 chatbot.py 的 run-* 子命令（urllib 实现）—— 本 conf 的载荷不再需要
;    curl，容器内启用本 conf 也不需要镜像含 curl。qdrant/ollama 两 program 仍
;    只依赖 .env 注入与 PATH/变量解析，与 curl 无关。

; ── qdrant（priority=10）─────────────────────────────────────────────────────
; 与 start.sh _start_qdrant 同源：QDRANT__SERVICE__HOST=127.0.0.1、storage=仓库
; storage/、--config-path 同一个 config.yaml。autorestart=false 的职责（重要）：
; 这是“复用外部实例”语义 —— 本机 6333 已被外部 Qdrant 占用时，本进程 bind 失败
; 即退出（EXITED 状态，startsecs=0 所以不进 BACKOFF/FATAL，也不再空拉）；只有
; 6333 真的空闲时才真正启动并托管（生命周期交 supervisorctl）。stop 由
; supervisorctl 统一清理。
[program:qdrant]
command=/bin/bash -c 'set -a; . ./.env; export QDRANT__SERVICE__HOST=127.0.0.1 QDRANT__STORAGE__STORAGE_PATH=%(here)s/storage; mkdir -p %(here)s/storage; exec "${QDRANT_BIN:-%(here)s/.bin/qdrant/qdrant}" --config-path "%(here)s/qdrant_config/config.yaml"'
directory=%(here)s
priority=10
autostart=true
autorestart=false
startsecs=0
stopwaitsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/artifacts/logs/qdrant.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2

; ── ollama（priority=10）─────────────────────────────────────────────────────
; 与 start.sh _start_ollama 同源：`ollama serve` 从 PATH 起；.env 的 OLLAMA_*
; （KEEP_ALIVE / NUM_PARALLEL / FLASH_ATTENTION / KV_CACHE_TYPE 等）由 set -a
; source 生效。可执行文件可被 OLLAMA_BIN 覆盖（缺省仍是 PATH 的 ollama，本地
; 与 start.sh 完全一致；容器内启用时 export OLLAMA_BIN=/usr/local/bin/ollama）。
; autorestart=false：11434 已被外部 Ollama（常见桌面版/launchd 开机自启）占用时
; bind 失败自退（复用语义，同上不空拉）；11434 空闲才真正托管。
[program:ollama]
command=/bin/bash -c 'set -a; . ./.env; exec "${OLLAMA_BIN:-ollama}" serve'
directory=%(here)s
priority=10
autostart=true
autorestart=false
startsecs=0
stopwaitsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/artifacts/logs/ollama.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2

; ── infinity（priority=20）───────────────────────────────────────────────────
; 载荷缩编（2026-11-11 audit A3）：command 只剩 "set -a 注入 .env + exec
; chatbot.py run-infinity --watch"。infinity 的启动参数（--model-id/--served-
; model-name 成对、--dtype 推导、--no-model-warmup、端口/设备/批大小）的唯一真相
; = chatbot.py 的 _infinity_spec —— 此前这里与 start.sh _ensure_infinity、容器
; _infinity_spec 三份手工同步（改一处漏两处的部署断点原型），现在 shell 不再拼装。
; 看门狗语义（run-infinity --watch，Python 侧实现）：
;   · 8001 已有健康 infinity（通常就是 start.sh 或手起的外部实例）→ 不再重复 bind
;     （否则必撞端口退出、FATAL 化），转成 3s 轮询哨兵；
;   · 外部实例消失 → 退出 71 → unexpected → autorestart 拉起 → 重探端口 → 空闲则
;     exec 真服务接管；
;   · 内部 exec 链不换 pid：python → infinity_emb（os.execv）同 pid，supervisord
;     的信号直达真服务。
; exitcodes=0：真正的崩溃（非 0，含 71/70）→ unexpected → 拉起；真服务正常收尾
; （0）不拉起。startsecs=300 + startretries=3：torch 冷加载期（fp32 两模型 8G 机器
; 实测分钟级）内快速死亡判为启动失败，3 次退避后收敛 FATAL —— 防 8G 内存被无限
; 重拉打铁；启动期之后的运行期崩溃照常立即拉起。
[program:infinity]
command=/bin/bash -c 'set -a; . ./.env; exec "${PYTHON:-python}" chatbot.py run-infinity --watch'
directory=%(here)s
priority=20
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=300
startretries=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
environment=PYTHONUNBUFFERED="1"
stdout_logfile=%(here)s/artifacts/logs/infinity.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2

; ── app（priority=40）────────────────────────────────────────────────────────
; 载荷缩编（2026-11-11 audit A3）：command 只剩 "set -a 注入 .env + exec
; chatbot.py run-app --watch"。真服务单源 = cmd_serve（端口唯一来源 APP_PORT =
; RAG_LOCAL_PORT/RAG_APP_PORT 覆盖、缺省 8501，与 .streamlit/config.toml 裸 run
; 缺省一致 —— 三分支与端口判断都不要在这里重复写）；这里不再调 _ensure_infinity：
; infinity 已是上方的托管程序，重复编排会双管。
; 三分支（run-app --watch，Python 侧实现）：
;   a) 端口健康且命令行是本项目 streamlit（_streamlit_pids 按本文件绝对路径逐 pid
;      核对，比旧载荷的裸 pgrep -f 严 —— 同名 chatbot.py 的其他项目实例不误判）
;      → 复用 + 看门狗（实例消失退出 71 重拉接管）；
;   b) 端口健康但归属证明不了 → 退出 70（start.sh 同款 fail-closed），startretries
;      耗尽后停在 FATAL，需人工处置（不空转）；
;   c) 端口空闲 → exec cmd_serve 真服务（其内部再 exec streamlit run；两层 exec
;      都不换 pid，supervisord 信号直达真服务）。
; exitcodes=0：真服务正常收尾（0）不拉起；崩溃/71/70 → unexpected → 拉起。
; startsecs=30 + startretries=3：启动期秒崩（import 失败等）收敛 FATAL；启动后
; 运行期崩溃立即拉起。
[program:app]
command=/bin/bash -c 'set -a; . ./.env; exec "${PYTHON:-python}" chatbot.py run-app --watch'
directory=%(here)s
priority=40
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=30
startretries=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
environment=PYTHONUNBUFFERED="1"
stdout_logfile=%(here)s/artifacts/logs/streamlit.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
