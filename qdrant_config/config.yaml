# Qdrant 配置（挂载为 /qdrant/config/production.yaml）
# 文档: https://qdrant.tech/documentation/operations/configuration/

log_level: INFO

storage:
  storage_path: /qdrant/storage
  # 键名两处都必须对，否则整块被 serde 静默丢弃（qdrant 不用 deny_unknown_fields，
  # 连警告都没有，两个阈值退回内置默认）：
  #   optimizers → optimizers    Qdrant 1.x 的字段名，拼错不报错、只是不生效
  #   memmap_threshold_kb → memmap_threshold   1.x 已改名，值仍是 KB
  # ★ indexing_threshold 上有反例（实测 .bin/qdrant 1.19.1）：**这份 YAML 配置文件**
  #   的 schema 只认 indexing_threshold_kb —— 写 indexing_threshold 直接启动失败
  #   （错误"duplicate field indexing_threshold"，是 serde flatten/alias 展开的坑，
  #   不是"拼写错被静默丢"）。REST API 的 OptimizersConfigDiff 才用无 _kb 的
  #   indexing_threshold —— **两个 schema 不同源，别照 API 文档改这里**。
  # 语义（官方 config/config.yaml 注释）：memmap_threshold 是"单 segment 内嵌向量的
  # 上限 KB，超过就落成只读 memmap 文件"；indexing_threshold_kb 是"单 segment 未索引点
  # 数超过它就建 HNSW"。
  optimizers:
    memmap_threshold: 20000
    indexing_threshold_kb: 20000

service:
  grpc_port: 6334
  http_port: 6333
  host: 0.0.0.0
