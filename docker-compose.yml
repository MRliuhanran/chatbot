version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - ./qdrant_storage:/qdrant/storage
      - ./qdrant_config/config.yaml:/qdrant/config/production.yaml
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
    healthcheck:
      # 不能用 curl：qdrant 官方镜像没有 curl/wget（原实现让容器永远 unhealthy，
      # 实测 FailingStreak 1031）。镜像自带 bash，故用 /dev/tcp 发 HTTP 请求并校验
      # 状态码 —— 既能发现端口未监听，也能发现服务未真正就绪。
      # $$line 必须双写：compose 会把单个 $ 当变量插值，会让探测永远失败。
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /healthz HTTP/1.0\\r\\n\\r\\n\" >&3; read -r line <&3; [[ $$line == *200* ]]'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - qdrant-network

networks:
  qdrant-network:
    driver: bridge
